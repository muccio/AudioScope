name: Build Windows Standalone Executable & Installer (.exe)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (windows-latest - x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pytest pytest-qt

      - name: Run Test Suite
        run: |
          pytest -v tests/

      - name: Execute Windows Standalone Build Pipeline
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1

      - name: Test Compiled Executable (--check-build)
        shell: powershell
        run: |
          & "dist/AudioScope/AudioScope.exe" --check-build

      - name: Compress Portable Folder
        shell: powershell
        run: |
          Compress-Archive -Path "dist/AudioScope" -DestinationPath "dist/AudioScope-windows-x64-portable.zip" -Force

      - name: Upload Windows Portable Executable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: AudioScope-windows-x64-portable
          path: dist/AudioScope-windows-x64-portable.zip
          retention-days: 14

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: AudioScope-windows-x64-setup
          path: dist/AudioScope-Setup-*.exe
          if-no-files-found: warn
          retention-days: 14

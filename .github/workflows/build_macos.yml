name: Build macOS Standalone Application (.app & .dmg)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            python-arch: arm64
            display-name: "Apple Silicon (arm64)"
          - os: macos-13
            arch: x86_64
            python-arch: x86_64
            display-name: "Intel (x86_64)"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Test Suite
        run: |
          pytest -v tests/

      - name: Execute macOS Standalone Build Pipeline
        run: |
          bash packaging/build_macos.sh

      - name: Compress AudioScope.app
        run: |
          cd dist
          zip -r "AudioScope-macos-${{ matrix.arch }}.app.zip" AudioScope.app

      - name: Upload macOS Application (.app.zip)
        uses: actions/upload-artifact@v4
        with:
          name: AudioScope-macos-${{ matrix.arch }}-app
          path: dist/AudioScope-macos-${{ matrix.arch }}.app.zip
          retention-days: 14

      - name: Upload macOS Disk Image (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: AudioScope-macos-${{ matrix.arch }}-dmg
          path: dist/AudioScope.dmg
          retention-days: 14

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioscope"
version = "1.0.0"
description = "Universal Audio File Inspector & Broadcast Loudness Analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AudioScope Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "PySide6>=6.5.0",
    "av>=11.0.0",
    "mutagen>=1.47.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyloudnorm>=0.1.1",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
audioscope = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
